<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Microsoft Store - Windows 11</title> 

    <style> 

        :root { 

            --bg-color: #202020; 

            --card-bg: #2d2d2d; 

            --card-hover: #3b3b3b; 

            --text-color: #ffffff; 

        } 

        body, html { 

            margin: 0; padding: 0; width: 100%; height: 100%; 

            font-family: 'Segoe UI', sans-serif; 

            background-color: var(--bg-color); color: var(--text-color); 

            overflow-x: hidden; 

        } 

       .game-frame-container { 

    width: 100%; 

    height: 100vh; 

    display: none; 

    position: absolute; 

    top: 0; 

    left: 0; 

    background-color: #000000; /* Black background padding if the window is resized */ 

    box-sizing: border-box; 

} 

 

#iframe-target { 

    width: 100%; 

    max-width: 100vw; 

    height: 100%; 

    max-height: 100vh; 

    aspect-ratio: 16 / 9; /* Forces the game into widescreen layout */ 

    margin: auto; /* Automatically centers the game on screen */ 

} 

 

iframe { 

    width: 100%; 

    height: 100%; 

    border: none; 

    display: block; 

} 
         

        /* Game Card Styles */ 

        .game-card { 

            background-color: var(--card-bg); border: 1px solid #3c3c3c; 

            border-radius: 8px; padding: 15px; text-align: center; 

            cursor: pointer; transition: transform 0.2s, background-color 0.2s; 

            text-decoration: none; color: inherit; display: block; 

        } 

        .game-card:hover { transform: translateY(-4px); background-color: var(--card-hover); } 

         

        /* Game Thumbnail Layout */ 

        .game-thumbnail { 

            width: 100%; height: 130px; object-fit: cover; 

            border-radius: 6px; margin-bottom: 12px; 

            background-color: #444; /* Fallback color if image fails to load */ 

        } 

        .game-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; } 

        .game-developer { font-size: 12px; color: #aaaaaa; } 

    </style> 

</head> 

<body> 

 

    <div id="game-layer" class="game-frame-container"><div id="iframe-target"></div></div> 

 

    <div id="store-layer" class="store-hub"> 

        <h1>Microsoft Store</h1> 

        <p style="color:#aaa; margin-bottom:40px;">Windows 11 Presentation Game Hub</p> 

        <div class="game-grid"> 

             

            <!-- Game Card 1: Doodle Jump --> 

            <a href="?game=doodlejump" class="game-card"> 

                <img src="<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWhJRGPmQEmJsV8ID5DVfEgoVS3w4eb1iXa0dB8EqBPw&amp;s=10"/>" class="game-thumbnail" alt="Doodle Jump"> 

                <div class="game-title">Doodle Jump</div> 

                <div class="game-developer">Free • Games</div> 

            </a> 

 

            <!-- Game Card 2: Your 50MB Game --> 

            <a href="?game=heavygame" class="game-card"> 

                <img src="heavy-logo.png" class="game-thumbnail" alt="Game Logo"> 

                <div class="game-title">Massive Game</div> 

                <div class="game-developer">Free • Games</div> 

            </a> 

 

        </div> 

    </div> 

 

    <script> 

        const urlParams = new URLSearchParams(window.location.search); 

        const gameName = urlParams.get('game'); 

        if (gameName) { 

            document.getElementById('store-layer').style.display = 'none'; 

            document.getElementById('game-layer').style.display = 'block'; 

            document.getElementById('iframe-target').innerHTML = `<iframe src="HTML Games/${gameName}.html" allow="autoplay"></iframe>`; 

        } 

    </script> 

</body> 

</html>
