<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <link rel="stylesheet" href="https://jsdelivr.net">

    <link rel="stylesheet" href="https://googleapis.com">

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Microsoft Store - Windows 11</title> 

    <style> 

        :root { 

            --bg-color: #202020; 

            --card-bg: #2d2d2d; 

            --card-hover: #3b3b3b; 

            --text-color: #ffffff; 

        } 

        body, html { 

            margin: 0; padding: 0; width: 100%; height: 100%; 

            font-family: 'Segoe UI', sans-serif; 

            background-color: var(--bg-color); color: var(--text-color); 

            overflow-x: hidden; 

        } 

       .game-frame-container { 

    width: 100%; 

    height: auto; 

    display: none; 

    position: absolute; 

    top: 0; 

    left: 0; 

    background-color: #000000; /* Black background padding if the window is resized */ 

    box-sizing: border-box; 

} 

 

#iframe-target { 

    width: 100%; 

    max-width: 100vw; 

    height: 100%; 

    max-height: auto; 

    aspect-ratio: 16 / 9; /* Forces the game into widescreen layout */ 

    margin: auto; /* Automatically centers the game on screen */ 

} 

 

iframe { 

    width: 100%; 

    height: 100%; 

    border: none; 

    display: block; 

} 
         
        .game-card { 

            background-color: var(--card-bg); border: 1px solid #3c3c3c; 

            border-radius: 8px; padding: 15px; text-align: center; 

            cursor: pointer; transition: transform 0.2s, background-color 0.2s; 

            text-decoration: none; color: inherit; display: block; 

        } 

        .game-card:hover { transform: translateY(-4px); background-color: var(--card-hover); } 


        .game-thumbnail { 
            width: 100%; 
            height: 100px; 
            object-fit: contain; 
            border-radius: 6px;
            margin-bottom: 12px; 
        } 

        .game-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; } 

        .game-developer { font-size: 12px; color: #aaaaaa; } 

    </style> 

</head> 

<body> 

 

    <div id="game-layer" class="game-frame-container"><div id="iframe-target"></div></div> 

 

        <div id="store-layer" class="store-hub"> 

        <h1>Microsoft Store</h1> 

        <p style="color:#aaa; margin-bottom:40px;">Windows 11 Presentation Game Hub</p> 

         

        <div class="game-grid"> 

             

            <!-- Game Card 1: Doodle Jump --> 

            <a href="?game=doodlejump" class="game-card"> 

                <img src="Game Thumbnails/doodlejumplogo.png" class="game-thumbnail" alt="Doodle Jump"> 

                <div class="game-title">Doodle Jump</div> 

                <div class="game-developer">Free Games</div> 

            </a> 

 

            <!-- Add this card into your Microsoft Store app grid list --> 

            <a href="?game=https://cdn.jsdelivr.net/gh/CloudMoonApp/web@main/260909.svg" class="game-card"> 
                
                <div class="game-icon" style="background: linear-gradient(135deg, #120c1f, #8b5cf6);">🌙</div> 
                
                <div class="game-title">CloudMoon Remote App (CDN)</div> 
                
                <div class="game-developer">Free • Cloud Stream Platform</div> 
            
            </a> 


        </div> 

    </div> 

 

    <script>
       
       const urlParams = new URLSearchParams(window.location.search); 
        
        const gameName = urlParams.get('game'); 
        
        if (gameName) { 
            
            document.getElementById('store-layer').style.display = 'none'; 
            
            document.getElementById('game-layer').style.display = 'block'; 
            
        let finalUrl = ""; 

        }
        
        // Check if the parameter is an external CDN web link  
    
        if (gameName.startsWith('http://') || gameName.startsWith('https://')) { 
            
            finalUrl = gameName; 
        
            } else { 
                // Otherwise, pull it locally from your games folder configuration 
                
                finalUrl = `games/${gameName}.html`; 
            
        } 

     

    // Inject the frame smoothly into your centered widescreen player 

    document.getElementById('iframe-target').innerHTML = `<iframe src="${finalUrl}" allow="autoplay; gamepad; fullscreen;"></iframe>`; 
        

    </script> 

</body> 

</html>
